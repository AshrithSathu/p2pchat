packages:
  - .
  - landing
  - relay

supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

injectWorkspacePackages: true

allowBuilds:
  '@signalapp/libsignal-client': true
  better-sqlite3: true
  esbuild: true
  koffi: false
  workerd: true
confirmModulesPurge: false
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.2'
overrides:
  '@chainsafe/libp2p-yamux>uint8arraylist': 3.0.2
storeDir: .pnpm-store
