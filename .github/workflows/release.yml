name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish private distribution
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Verify release versions
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test "v$(node -e "import('./dist/core/version.js').then(({ APP_VERSION }) => process.stdout.write(APP_VERSION))")" = "$RELEASE_TAG"
      - name: Build release artifacts
        run: pnpm distribution:build
      - name: Upload GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Upload versioned archives to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          for archive in release/*.tar.gz; do
            filename=$(basename "$archive")
            node relay/node_modules/wrangler/bin/wrangler.js r2 object put \
              "p2pchat-releases/releases/$filename" \
              --file "$archive" \
              --content-type application/gzip \
              --cache-control 'public, max-age=31536000, immutable' \
              --remote
          done
      - name: Publish release manifest last
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node relay/node_modules/wrangler/bin/wrangler.js r2 object put \
            p2pchat-releases/releases/latest.json \
            --file release/latest.json \
            --content-type application/json \
            --cache-control no-store \
            --remote

  sync-develop:
    name: Open main-to-develop sync
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Open sync pull request when needed
        run: |
          ahead_by=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...main" --jq .ahead_by)
          if [ "$ahead_by" -eq 0 ]; then
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head main \
            --title "chore: sync $RELEASE_TAG back to develop" \
            --body "Synchronizes the automated release version, changelog, and manifest back into the integration branch."
