services:
  coturn:
    image: coturn/coturn:4.15.0-r0@sha256:0feee4fc1f45c7c053c8fee3e1ab941b1a1b9a0429bc01e18126735410770bfd
    restart: unless-stopped
    ports:
      - '127.0.0.1:3478:3478/tcp'
      - '127.0.0.1:3478:3478/udp'
      - '127.0.0.1:49160-49200:49160-49200/udp'
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=127.0.0.1
      - --realm=p2pchat.local
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${COTURN_SHARED_SECRET:?Run pnpm turn:setup first}
      - --allow-loopback-peers
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --simple-log
    tmpfs:
      - /var/lib/coturn
